# Medeo Mini App-ты GitHub Pages-ке жариялайды.
# Бот кодына қатысы жоқ: тек miniapp/ қалтасы өзгергенде іске қосылады.
name: Mini App → GitHub Pages

on:
  push:
    branches: [miniapp, main]
    paths: ["miniapp/**", ".github/workflows/miniapp-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
        working-directory: miniapp
      - run: npm run build
        working-directory: miniapp
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp/dist
      - id: deployment
        uses: actions/deploy-pages@v4
