<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Squirrel.</title>
    <!-- Негізгі шрифт JS-пен қатар бірден жүктеледі (бұрын ең соңында сұралып, мәтін ~3 с көрінбейтін) -->
    <link rel="preload" href="/src/assets/fonts/medeo/MedeoSansVariable.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        // 1) Telegram Mini App-ты іске қосқанда параметрлерін мекенжайдың #-бөлігіне салады
        //    (#tgWebAppData=...&tgWebAppVersion=...). Жоғарыдағы ресми скрипт оларды оқып, sessionStorage-ке
        //    сақтап қойды; енді #-бөлікті тазалаймыз, әйтпесе маршрутизатор оны «белгісіз бет» деп оқиды.
        var h = location.hash;
        if (h && h.charAt(1) !== "/") history.replaceState(null, "", location.pathname + location.search + "#/");
        // 2) Макет 412px енге салынған. Телефонда браузерге «бет ені 412» деп айтамыз — ол кез келген
        //    экранға (360, 390, 430...) пропорциямен өзі сыйғызады. Планшет пен компьютерде макет ортада тұрады.
        if (Math.min(screen.width, screen.height) < 600) {
          document.querySelector('meta[name="viewport"]').setAttribute("content", "width=412, viewport-fit=cover, user-scalable=no");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
